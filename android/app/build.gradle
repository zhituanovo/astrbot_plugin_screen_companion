plugins {
    id 'com.android.application'
}

android {
    namespace 'com.astrbot.screencompanion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.astrbot.screencompanion'
        minSdk 26
        // API 33 keeps repeated on-demand captures compatible with Android 14 devices.
        targetSdk 33
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
}
